  useEffect(()=>{lu();lo();},[]);
  const nav=[{id:"units",icon:"🏠",label:"Unidades"},{id:"ops",icon:"👤",label:"Operarios"},{id:"logs",icon:"📋",label:"Historial"},{id:"cfg",icon:"⚙️",label:"Config"}];
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}><div style={{background:C.sf,borderBottom:`1px solid ${C.br}`,padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}><span style={{fontSize:16,fontWeight:700,color:C.ac}}>CleanOps <span style={{color:C.mu,fontSize:11,fontWeight:400}}>Admin</span></span><Bt onClick={onLogout} v="g" small>Salir</Bt></div><div style={{flex:1,padding:18,maxWidth:680,margin:"0 auto",width:"100%"}}>{tab==="units"&&(sel?<TMgr unit={sel} onBack={()=>{setSel(null);lu();}} allUnits={units}/>:<UMgr units={units} onSelect={setSel} onRefresh={lu}/>)}{tab==="ops"&&<OMgr ops={ops} units={units} onRefresh={lo}/>}{tab==="logs"&&<Logs units={units} ops={ops}/>}{tab==="cfg"&&<Cfg/>}</div><div style={{background:C.sf,borderTop:`1px solid ${C.br}`,display:"flex",position:"sticky",bottom:0}}>{nav.map(n=><button key={n.id} onClick={()=>{setTab(n.id);setSel(null);}} style={{flex:1,padding:"11px 4px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:tab===n.id?C.ac:C.mu}}><span style={{fontSize:18}}>{n.icon}</span><span style={{fontSize:10,fontWeight:600}}>{n.label}</span></button>)}</div></div>;
}

function Checklist({unit,operator,onBack}){
  const[tasks,setTasks]=useState([]);const[states,setStates]=useState({});const[idx,setIdx]=useState(0);const[session,setSession]=useState(null);const[showCmt,setShowCmt]=useState(false);const[cmt,setCmt]=useState("");const[pendSt,setPendSt]=useState(null);const[allDone,setAllDone]=useState(false);const[sending,setSending]=useState(false);const sxRef=useRef(null);
  useEffect(()=>{(async()=>{const td=await sg("tasks",`unit_id=eq.${unit.id}&select=*&order=sort_order`);setTasks(td||[]);const today=new Date().toISOString().split("T")[0];let sa=await sg("checklist_sessions",`unit_id=eq.${unit.id}&date=eq.${today}&select=*&order=created_at.desc&limit=1`);let sess=sa?.[0];if(!sess){const ns=await sp("checklist_sessions",{unit_id:unit.id,operator_id:operator.id,date:today});sess=ns?.[0]||null;}setSession(sess);if(sess){const logs=await sg("task_logs",`session_id=eq.${sess.id}&select=*`);const st={};(logs||[]).forEach(l=>{st[l.task_id]={status:l.status,comment:l.comment};});setStates(st);}await sw("units",`id=eq.${unit.id}`,{status:"in_progress"});})();},[]);
  useEffect(()=>{if(tasks.length>0)setAllDone(tasks.every(t=>states[t.id]?.status==="done"||states[t.id]?.status==="problem"));},[states,tasks]);
  const confirm=async()=>{const task=tasks[idx];if(!task||!session)return;if(states[task.id])await sw("task_logs",`session_id=eq.${session.id}&task_id=eq.${task.id}`,{status:pendSt,comment:cmt||null});else await sp("task_logs",{session_id:session.id,task_id:task.id,operator_id:operator.id,status:pendSt,comment:cmt||null});setStates(p=>({...p,[task.id]:{status:pendSt,comment:cmt}}));setShowCmt(false);setCmt("");setPendSt(null);if(idx<tasks.length-1)setTimeout(()=>setIdx(i=>i+1),400);};
  const finish=async()=>{setSending(true);await sw("units",`id=eq.${unit.id}`,{status:"done"});if(session)await sw("checklist_sessions",`id=eq.${session.id}`,{completed_at:new Date().toISOString()});const wa=gw();const today=new Date().toLocaleDateString("es-AR");const problems=tasks.filter(t=>states[t.id]?.status==="problem");const cmts=tasks.filter(t=>states[t.id]?.comment);let msg=`✅ *${unit.name}* — Lista\n📅 ${today} | 👤 ${operator.name}\n\n`;if(problems.length){msg+=`⚠️ *INCIDENCIAS:*\n`;problems.forEach(t=>{msg+=`• ${t.title}`;if(states[t.id]?.comment)msg+=`: ${states[t.id].comment}`;msg+="\n";});msg+="\n";}const ec=cmts.filter(t=>states[t.id]?.status!=="problem");if(ec.length){msg+=`💬 *COMENTARIOS:*\n`;ec.forEach(t=>{msg+=`• ${t.title}: ${states[t.id].comment}\n`;});}if(!problems.length&&!cmts.length)msg+=`Todo perfecto. Unidad disponible. 🏠`;window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,"_blank");setSending(false);};
  const swipe=dir=>{if(dir>0&&idx<tasks.length-1)setIdx(i=>i+1);if(dir<0&&idx>0)setIdx(i=>i-1);};
  const task=tasks[idx];const tstate=task?states[task.id]:null;const done=tstate?.status==="done";const prob=tstate?.status==="problem";const totalDone=tasks.filter(t=>states[t.id]?.status).length;
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",maxWidth:500,margin:"0 auto"}}><div style={{padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",background:C.sf,borderBottom:`1px solid ${C.br}`}}><Bt onClick={onBack} v="g" small>← Volver</Bt><div style={{textAlign:"center"}}><p style={{fontSize:14,fontWeight:700}}>{unit.name}</p><p style={{fontSize:10,color:C.mu}}>{totalDone}/{tasks.length}</p></div><div style={{width:60}}/></div><div style={{height:3,background:C.br}}><div style={{height:"100%",width:`${tasks.length?(totalDone/tasks.length)*100:0}%`,background:C.ac,transition:"width .5s"}}/></div>{allDone?<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:40,textAlign:"center"}}><div style={{fontSize:72,marginBottom:18}}>🏠✨</div><h2 style={{fontSize:26,fontWeight:800,marginBottom:8}}>¡{unit.name} lista!</h2><p style={{color:C.mu,marginBottom:28}}>Todas las tareas completadas</p>{tasks.filter(t=>states[t.id]?.status==="problem").length>0&&<div style={{background:`${C.wn}18`,border:`1px solid ${C.wn}44`,borderRadius:12,padding:"13px 18px",marginBottom:18,width:"100%",textAlign:"left"}}><p style={{color:C.wn,fontWeight:600,fontSize:13,marginBottom:5}}>⚠️ {tasks.filter(t=>states[t.id]?.status==="problem").length} incidencia(s)</p>{tasks.filter(t=>states[t.id]?.status==="problem").map(t=><p key={t.id} style={{fontSize:12,color:C.mu}}>• {t.title}</p>)}</div>}<Bt onClick={finish} full disabled={sending} style={{padding:16}}>{sending?"Abriendo WhatsApp...":"📲 Enviar reporte WhatsApp"}</Bt></div>:task&&<div style={{flex:1,display:"flex",flexDirection:"column"}}><div style={{flex:1,position:"relative",overflow:"hidden",margin:14,borderRadius:20,minHeight:320,cursor:"grab",background:C.sf,userSelect:"none"}} onTouchStart={e=>sxRef.current=e.touches[0].clientX} onTouchEnd={e=>{const dx=e.changedTouches[0].clientX-sxRef.current;if(Math.abs(dx)>50)swipe(dx<0?1:-1);}} onMouseDown={e=>sxRef.current=e.clientX} onMouseUp={e=>{const dx=e.clientX-sxRef.current;if(Math.abs(dx)>50)swipe(dx<0?1:-1);}}>{task.image_url?<img src={task.image_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover",filter:done?"brightness(.3) saturate(0)":prob?"brightness(.3) sepia(1)":"brightness(.65)",transition:"filter .4s",position:"absolute",inset:0}}/>:<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:60}}>📋</div>}<div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%)"}}/>{(done||prob)&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:80,height:80,borderRadius:"50%",background:done?`${C.ok}30`:`${C.wn}30`,border:`3px solid ${done?C.ok:C.wn}`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:34,color:done?C.ok:C.wn}}>{done?"✓":"⚠"}</span></div></div>}<div style={{position:"absolute",top:13,left:13,background:"rgba(0,0,0,.6)",borderRadius:20,padding:"4px 12px"}}><span style={{fontSize:12,color:"white",fontWeight:600}}>{idx+1}/{tasks.length}</span></div><div style={{position:"absolute",top:13,right:13,background:"rgba(0,0,0,.6)",borderRadius:20,padding:"4px 12px"}}><span style={{fontSize:12,color:C.ac,fontWeight:600}}>⏱ {task.estimated_minutes}min</span></div><div style={{position:"absolute",bottom:0,left:0,right:0,padding:18}}><h3 style={{fontSize:21,fontWeight:700,color:"white",marginBottom:5,textDecoration:(done||prob)?"line-through":"none",opacity:(done||prob)?.6:1}}>{task.title}</h3>{task.description&&<p style={{fontSize:13,color:"rgba(255,255,255,.75)",lineHeight:1.4}}>{task.description}</p>}{tstate?.comment&&<div style={{marginTop:8,background:"rgba(0,0,0,.4)",borderRadius:8,padding:"6px 10px"}}><p style={{fontSize:12,color:"rgba(255,255,255,.6)"}}>💬 {tstate.comment}</p></div>}</div></div><div style={{padding:"0 14px 14px",display:"flex",flexDirection:"column",gap:10}}>{!showCmt?<div style={{display:"flex",gap:8}}><Bt onClick={()=>swipe(-1)} v="g" disabled={idx===0} style={{flex:1}}>←</Bt><Bt onClick={()=>{setPendSt("done");setShowCmt(true);}} v={done?"s":"ok"} style={{flex:2}}>{done?"✓ Hecho":"✅ Listo"}</Bt><Bt onClick={()=>{setPendSt("problem");setShowCmt(true);}} v={prob?"s":"d"} style={{flex:2}}>{prob?"⚠ Prob.":"⚠️ Problema"}</Bt><Bt onClick={()=>swipe(1)} v="g" disabled={idx===tasks.length-1} style={{flex:1}}>→</Bt></div>:<div style={{background:C.sf,border:`1px solid ${pendSt==="problem"?C.wn:C.ok}44`,borderRadius:14,padding:15}}><p style={{fontSize:13,color:C.mu,marginBottom:10}}>{pendSt==="problem"?"⚠️ Describí el problema:":"💬 Comentario opcional:"}</p><Ta value={cmt} onChange={setCmt} placeholder="Observación..." rows={2}/><div style={{display:"flex",gap:10,marginTop:12}}><Bt onClick={confirm} v={pendSt==="problem"?"d":"ok"} style={{flex:1}}>Confirmar</Bt><Bt onClick={()=>{setShowCmt(false);setCmt("");setPendSt(null);}} v="g">Cancelar</Bt></div></div>}</div><div style={{display:"flex",justifyContent:"center",gap:6,padding:"0 20px 18px",flexWrap:"wrap"}}>{tasks.map((t,i)=>{const s=states[t.id]?.status;return <button key={t.id} onClick={()=>setIdx(i)} style={{width:i===idx?20:8,height:8,borderRadius:4,border:"none",background:s==="done"?C.ok:s==="problem"?C.wn:i===idx?C.ac:C.br,transition:"all .3s",cursor:"pointer",padding:0}}/>;})}</div></div>}</div>;
}

function OView({operator}){
  const[units,setUnits]=useState([]);const[loading,setLoading]=useState(true);const[sel,setSel]=useState(null);
  useEffect(()=>{(async()=>{const ou=await sg("operator_units",`operator_id=eq.${operator.id}&select=unit_id`);if(!ou?.length){setLoading(false);return;}const ids=ou.map(o=>o.unit_id).join(",");const d=await sg("units",`id=in.(${ids})&select=*`);setUnits(d||[]);setLoading(false);})();},[]);
  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><Sp/></div>;
  if(sel)return <Checklist unit={sel} operator={operator} onBack={()=>{setSel(null);}}/>;
  return <div style={{minHeight:"100vh",padding:"24px 20px"}}><div style={{maxWidth:500,margin:"0 auto"}}><div style={{marginBottom:28}}><p style={{fontSize:11,color:C.ac,letterSpacing:2,textTransform:"uppercase",fontWeight:600}}>Bienvenida/o</p><h1 style={{fontSize:26,fontWeight:800}}>{operator.name}</h1></div>{units.length===0?<p style={{color:C.mu,textAlign:"center",padding:40}}>Sin unidades asignadas.</p>:<div style={{display:"flex",flexDirection:"column",gap:12}}><p style={{fontSize:13,color:C.mu,marginBottom:4}}>Seleccioná la unidad:</p>{units.map(u=>{const s=sc[u.status]||sc.pending;return <button key={u.id} onClick={()=>setSel(u)} style={{background:C.sf,border:`1px solid ${C.br}`,borderRadius:16,padding:18,textAlign:"left",cursor:"pointer",width:"100%"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}><div><p style={{fontSize:17,fontWeight:700,color:C.tx}}>{u.name}</p>{u.description&&<p style={{fontSize:12,color:C.mu,marginTop:3}}>{u.description}</p>}</div><Tg color={s.c}>{s.i} {s.l}</Tg></div></button>;})}</div>}</div></div>;
}

function App(){
  const[screen,setScreen]=useState("loading");const[operator,setOperator]=useState(null);
  useEffect(()=>{const p=new URLSearchParams(window.location.search).get("op");if(p){setScreen("login");return;}sg("units","select=id&limit=1").then(()=>setScreen("login")).catch(()=>setScreen("login"));},[]);
  if(screen==="loading")return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><Sp/></div>;
  return <>{screen==="login"&&<Login onAdmin={()=>setScreen("admin")} onOp={op=>{setOperator(op);setScreen("operator");}}/>}{screen==="admin"&&<Admin onLogout={()=>setScreen("login")}/>}{screen==="operator"&&operator&&<OView operator={operator}/>}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
